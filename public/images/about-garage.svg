<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t">
  <title id="t">Mechanic's workbench with tools, a tool board and an engine on a stand</title>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2126"/><stop offset="1" stop-color="#14171a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a636d"/><stop offset="1" stop-color="#2b3036"/>
    </linearGradient>
    <radialGradient id="l" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#fff2e2" stop-opacity="0.3"/><stop offset="1" stop-color="#fff2e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5b14" stop-opacity="0.28"/><stop offset="1" stop-color="#ff5b14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="peg" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.6" fill="#0f1113"/>
    </pattern>
  </defs>
  <rect width="640" height="560" fill="url(#w)"/>
  <!-- lamp -->
  <rect x="200" y="30" width="240" height="8" fill="#ffe9d6" opacity="0.9"/>
  <path d="M200 38h240l140 400H60z" fill="url(#l)"/>

  <!-- pegboard -->
  <rect x="60" y="80" width="520" height="220" fill="#2a2f35"/>
  <rect x="60" y="80" width="520" height="220" fill="url(#peg)"/>
  <rect x="60" y="80" width="520" height="220" fill="none" stroke="#3b4148" stroke-width="2"/>
  <!-- tools on board -->
  <g fill="none" stroke="#b9c1c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- spanners -->
    <path d="M100 110v110"/><path d="M92 104a10 10 0 1 0 16 0"/>
    <path d="M125 110v120"/><path d="M116 104a11 11 0 1 0 18 0"/>
    <path d="M152 110v130"/><path d="M142 103a12 12 0 1 0 20 0"/>
    <path d="M180 110v140"/><path d="M169 102a13 13 0 1 0 22 0"/>
    <!-- screwdrivers -->
    <path d="M232 110v70M256 110v80M280 110v64"/>
  </g>
  <g>
    <rect x="226" y="176" width="12" height="44" rx="3" fill="#ff5b14"/>
    <rect x="250" y="186" width="12" height="44" rx="3" fill="#ff5b14"/>
    <rect x="274" y="170" width="12" height="44" rx="3" fill="#2d6be0"/>
  </g>
  <!-- hammer & pliers -->
  <g fill="none" stroke="#b9c1c9" stroke-width="6" stroke-linecap="round">
    <path d="M330 120v130"/>
    <path d="M380 130l30 110M420 130l-30 110"/>
  </g>
  <rect x="312" y="108" width="36" height="20" fill="#5a636d"/>
  <rect x="324" y="200" width="12" height="50" rx="3" fill="#ff5b14"/>
  <!-- socket set -->
  <g transform="translate(450 112)">
    <rect width="104" height="160" fill="#1b1e22" stroke="#3b4148"/>
    <g fill="#8a949f">
      <circle cx="22" cy="24" r="8"/><circle cx="52" cy="24" r="9"/><circle cx="82" cy="24" r="10"/>
      <circle cx="22" cy="58" r="8"/><circle cx="52" cy="58" r="9"/><circle cx="82" cy="58" r="10"/>
      <circle cx="22" cy="92" r="8"/><circle cx="52" cy="92" r="9"/><circle cx="82" cy="92" r="10"/>
    </g>
    <path d="M14 130h76" stroke="#ff5b14" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- workbench -->
  <rect x="30" y="330" width="380" height="18" fill="#6b4a2e"/>
  <rect x="30" y="330" width="380" height="5" fill="#8a6440"/>
  <rect x="44" y="348" width="16" height="170" fill="#2b3036"/>
  <rect x="380" y="348" width="16" height="170" fill="#2b3036"/>
  <rect x="60" y="360" width="320" height="100" fill="#ff5b14" opacity="0.85"/>
  <path d="M60 393h320M60 426h320" stroke="#8a2c06" stroke-width="2"/>
  <g fill="#2a1206" opacity="0.6"><rect x="200" y="372" width="40" height="5"/><rect x="200" y="405" width="40" height="5"/><rect x="200" y="438" width="40" height="5"/></g>
  <!-- items on bench -->
  <g>
    <rect x="70" y="298" width="70" height="32" rx="3" fill="#1b1e22" stroke="#3b4148"/>
    <rect x="78" y="306" width="36" height="16" fill="#3fd18a" opacity="0.85"/>
    <path d="M118 314h14" stroke="#8a949f" stroke-width="3"/>
    <text x="81" y="318" font-family="JetBrains Mono, monospace" font-size="9" fill="#0f1113">OBD</text>
    <path d="M140 316c30 0 30 10 60 10" stroke="#1b1e22" stroke-width="4" fill="none"/>
    <rect x="230" y="306" width="56" height="24" fill="#2d6be0"/>
    <rect x="230" y="300" width="56" height="8" fill="#1d4ed8"/>
    <rect x="300" y="290" width="18" height="40" rx="4" fill="#d6b04a"/>
    <rect x="304" y="282" width="10" height="10" fill="#1b1e22"/>
  </g>

  <!-- engine on stand -->
  <ellipse cx="510" cy="520" rx="110" ry="16" fill="url(#g)"/>
  <g transform="translate(430 340)">
    <path d="M70 120v60M30 180h80M40 180l-14 16M100 180l14 16" stroke="#3b4148" stroke-width="10" stroke-linecap="round"/>
    <rect x="10" y="20" width="140" height="100" rx="6" fill="url(#metal)" stroke="#7a848f" stroke-width="2"/>
    <rect x="22" y="0" width="116" height="26" rx="4" fill="#ff5b14"/>
    <g fill="#c9541a"><rect x="34" y="6" width="14" height="14" rx="2"/><rect x="60" y="6" width="14" height="14" rx="2"/><rect x="86" y="6" width="14" height="14" rx="2"/><rect x="112" y="6" width="14" height="14" rx="2"/></g>
    <circle cx="40" cy="80" r="22" fill="#1b1e22" stroke="#8a949f" stroke-width="3"/>
    <circle cx="40" cy="80" r="8" fill="#8a949f"/>
    <path d="M90 50h44M90 66h44M90 82h44M90 98h44" stroke="#2b3036" stroke-width="4"/>
    <path d="M-8 60h18M150 60h16" stroke="#8a949f" stroke-width="6"/>
  </g>

  <!-- floor -->
  <path d="M0 518h640" stroke="#2f343a" stroke-width="2"/>
  <rect y="519" width="640" height="41" fill="#111315"/>

  <!-- callout -->
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="#c9ced4" letter-spacing="1">
    <circle cx="105" cy="314" r="5" fill="#ff5b14"/>
    <path d="M105 314l-30-40" stroke="#ff5b14" stroke-width="1.5" fill="none" opacity="0"/>
    <circle cx="510" cy="400" r="5" fill="#ff5b14"/>
    <path d="M510 400l40-60h50" stroke="#ff5b14" stroke-width="1.5" fill="none"/>
    <text x="548" y="332">ENGINE</text>
  </g>
</svg>
