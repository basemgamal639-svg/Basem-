<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="t">
  <title id="t">Car raised on a two-post lift in a repair workshop</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2025"/>
      <stop offset="1" stop-color="#14171a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202429"/>
      <stop offset="1" stop-color="#101214"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4048"/>
      <stop offset="0.55" stop-color="#2a2f35"/>
      <stop offset="1" stop-color="#1c2025"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6672"/>
      <stop offset="1" stop-color="#262b31"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#fff3e6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff3e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5b14" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5b14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- room -->
  <rect width="720" height="600" fill="url(#wall)"/>
  <rect width="720" height="420" fill="url(#grid)"/>
  <!-- roller door -->
  <g opacity="0.55">
    <rect x="70" y="70" width="580" height="340" fill="#181b1f" stroke="#2c3137"/>
    <g stroke="#262a30" stroke-width="2">
      <path d="M70 100h580M70 130h580M70 160h580M70 190h580M70 220h580M70 250h580M70 280h580M70 310h580M70 340h580M70 370h580"/>
    </g>
  </g>
  <!-- ceiling lamps -->
  <g>
    <rect x="150" y="40" width="140" height="8" fill="#ffe9d6" opacity="0.9"/>
    <rect x="430" y="40" width="140" height="8" fill="#ffe9d6" opacity="0.9"/>
    <path d="M150 48h140l90 380H60z" fill="url(#lamp)"/>
    <path d="M430 48h140l90 380H340z" fill="url(#lamp)"/>
  </g>
  <!-- tool wall right -->
  <g opacity="0.8">
    <rect x="600" y="150" width="96" height="150" fill="#1f2328" stroke="#2f343a"/>
    <g fill="none" stroke="#7d8792" stroke-width="3" stroke-linecap="round">
      <path d="M618 170v40M632 170v48M646 170v36M660 170v44M674 170v40"/>
      <circle cx="625" cy="250" r="10"/><circle cx="660" cy="250" r="14"/>
      <path d="M612 285h70"/>
    </g>
    <rect x="618" y="166" width="6" height="8" fill="#ff5b14"/>
  </g>

  <!-- floor -->
  <rect y="420" width="720" height="180" fill="url(#floor)"/>
  <path d="M0 420h720" stroke="#3a4048" stroke-width="2"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M360 420 120 600M360 420 600 600M360 420 360 600M360 420 -100 600M360 420 820 600"/>
  </g>
  <!-- safety lines -->
  <path d="M80 560h560" stroke="#ffb703" stroke-width="6" stroke-dasharray="26 18" opacity="0.55"/>

  <!-- lift posts -->
  <g>
    <rect x="112" y="150" width="34" height="290" fill="#2b3036" stroke="#41474f"/>
    <rect x="574" y="150" width="34" height="290" fill="#2b3036" stroke="#41474f"/>
    <rect x="118" y="160" width="6" height="270" fill="#ff5b14"/>
    <rect x="596" y="160" width="6" height="270" fill="#ff5b14"/>
    <rect x="96" y="430" width="66" height="14" fill="#383e45"/>
    <rect x="558" y="430" width="66" height="14" fill="#383e45"/>
    <rect x="112" y="140" width="496" height="10" fill="#2b3036" stroke="#41474f"/>
    <!-- arms -->
    <path d="M146 318h120M574 318H454" stroke="#4a515a" stroke-width="10" stroke-linecap="round"/>
    <rect x="252" y="304" width="30" height="14" fill="#ff5b14"/>
    <rect x="438" y="304" width="30" height="14" fill="#ff5b14"/>
  </g>

  <!-- glow under car -->
  <ellipse cx="360" cy="470" rx="250" ry="34" fill="url(#glow)"/>

  <!-- car (side view, raised) -->
  <g transform="translate(0,-6)">
    <path d="M150 290c0-18 10-30 30-34l70-12 60-48c14-11 30-16 48-16h130c22 0 40 8 54 22l44 44 50 8c22 4 34 18 34 36v14c0 10-8 18-18 18H168c-10 0-18-8-18-18z" fill="url(#body)" stroke="#59626c" stroke-width="2"/>
    <!-- windows -->
    <path d="M268 244l52-42c10-8 22-12 36-12h44v54z" fill="url(#glass)" stroke="#6b7682"/>
    <path d="M412 190h38c16 0 30 6 40 16l38 38H412z" fill="url(#glass)" stroke="#6b7682"/>
    <path d="M405 190v118" stroke="#1a1d21" stroke-width="3"/>
    <!-- belt line and door seams -->
    <path d="M182 262h416" stroke="#545c66" stroke-width="1.5"/>
    <path d="M330 248v76M480 248v76" stroke="#1a1d21" stroke-width="2"/>
    <rect x="350" y="268" width="22" height="5" rx="2" fill="#7a848f"/>
    <rect x="500" y="268" width="22" height="5" rx="2" fill="#7a848f"/>
    <!-- lights -->
    <path d="M600 262h18c8 0 14 6 14 14v4h-30z" fill="#ffd2b3"/>
    <path d="M150 268h16v20h-16z" fill="#ff5b14"/>
    <!-- underbody -->
    <path d="M190 324h400" stroke="#0f1113" stroke-width="10"/>
    <!-- exhaust -->
    <path d="M200 330h120" stroke="#5f6770" stroke-width="5" stroke-linecap="round"/>
    <!-- wheels -->
    <g>
      <circle cx="238" cy="326" r="42" fill="#0e1012" stroke="#2c3137" stroke-width="3"/>
      <circle cx="238" cy="326" r="24" fill="#2a2f35" stroke="#8a949f" stroke-width="2"/>
      <circle cx="238" cy="326" r="6" fill="#8a949f"/>
      <g stroke="#8a949f" stroke-width="3"><path d="M238 304v44M216 326h44M222 310l32 32M254 310l-32 32"/></g>
      <circle cx="532" cy="326" r="42" fill="#0e1012" stroke="#2c3137" stroke-width="3"/>
      <circle cx="532" cy="326" r="24" fill="#2a2f35" stroke="#8a949f" stroke-width="2"/>
      <circle cx="532" cy="326" r="6" fill="#8a949f"/>
      <g stroke="#8a949f" stroke-width="3"><path d="M532 304v44M510 326h44M516 310l32 32M548 310l-32 32"/></g>
      <!-- brake caliper accent -->
      <path d="M548 300a30 30 0 0 1 10 14" stroke="#ff5b14" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M254 300a30 30 0 0 1 10 14" stroke="#ff5b14" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- tool cart -->
  <g transform="translate(470 440)">
    <rect x="0" y="0" width="120" height="86" fill="#c8400a"/>
    <rect x="0" y="0" width="120" height="86" fill="#ff5b14" opacity="0.85"/>
    <path d="M0 28h120M0 56h120" stroke="#8a2c06" stroke-width="2"/>
    <rect x="44" y="12" width="32" height="5" fill="#2a1206" opacity="0.6"/>
    <rect x="44" y="40" width="32" height="5" fill="#2a1206" opacity="0.6"/>
    <rect x="44" y="68" width="32" height="5" fill="#2a1206" opacity="0.6"/>
    <rect x="-4" y="-8" width="128" height="8" fill="#2b3036"/>
    <circle cx="14" cy="96" r="8" fill="#111"/><circle cx="106" cy="96" r="8" fill="#111"/>
    <path d="M20 -16h26M60 -18l20 10" stroke="#8a949f" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- tyre stack -->
  <g transform="translate(70 470)">
    <ellipse cx="50" cy="70" rx="50" ry="14" fill="#0b0c0e"/>
    <rect x="0" y="40" width="100" height="30" fill="#151719"/>
    <ellipse cx="50" cy="40" rx="50" ry="14" fill="#1d2023" stroke="#2c3137"/>
    <rect x="0" y="10" width="100" height="30" fill="#151719"/>
    <ellipse cx="50" cy="10" rx="50" ry="14" fill="#1d2023" stroke="#2c3137"/>
    <ellipse cx="50" cy="10" rx="22" ry="6" fill="#0b0c0e"/>
  </g>

  <!-- technical callouts -->
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="#c9ced4" letter-spacing="1">
    <g>
      <circle cx="532" cy="320" r="5" fill="#ff5b14"/>
      <path d="M532 320l40-100h80" stroke="#ff5b14" stroke-width="1.5" fill="none"/>
      <text x="580" y="212">BRAKES</text>
    </g>
    <g>
      <circle cx="290" cy="326" r="5" fill="#ff5b14"/>
      <path d="M290 326l-40 92H120" stroke="#ff5b14" stroke-width="1.5" fill="none" opacity="0"/>
    </g>
    <g>
      <circle cx="600" cy="276" r="5" fill="#ff5b14"/>
    </g>
    <g>
      <circle cx="260" cy="324" r="5" fill="#ff5b14" opacity="0"/>
      <circle cx="300" cy="230" r="5" fill="#ff5b14"/>
      <path d="M300 230l-50-120h-120" stroke="#ff5b14" stroke-width="1.5" fill="none"/>
      <text x="40" y="104" fill="#c9ced4">DIAGNOSTICS</text>
    </g>
  </g>
</svg>
